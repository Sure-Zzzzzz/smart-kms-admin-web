worker_processes 1;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  map $uri $static_cache {
    ~*\.html$ "no-cache";
    ~*\.(js|css|png|svg|ico|woff2?)$ "public, max-age=31536000, immutable";
    default "no-cache";
  }
  server {
    listen 80;

    # KMS 管理端构建基路径为 /app/kms/，由 IAM 统一入口反代本单元。
    location /app/kms/ {
      alias /www/kms-admin/;
      try_files $uri $uri/ /app/kms/index.html;
      add_header Cache-Control $static_cache;
    }

    # 浏览器只带 KMS PKCE Bearer Token，不携带 Portal Cookie。
    location /api/kms/ {
      proxy_pass http://host.docker.internal:8091;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
